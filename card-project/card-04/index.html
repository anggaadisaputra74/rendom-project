<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Project Part-#04</title>

    <!-- ===fonts google=== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap"
        rel="stylesheet">
    <!-- ===feather icons=== -->
    <script src="https://unpkg.com/feather-icons"></script>

    <!-- ===style.css=== -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- ===main-container=== -->
    <main class="main-container">
        <header class="page-header">
            <h1>tour packages</h1>
            <p>Jelajahi seluruh destinasi di pulau bali ini.</p>
        </header>
        <div class="card-grid">
            <div class="card">
                <div class="img">
                    <img src="img/01.jpg" alt="lempuyang tample">
                    <div class="card-icon">
                        <span class="icon"><i data-feather="map-pin" class="map"></i>Bali</span>
                        <span class="icon"><i data-feather="map-pin" class="map"></i>Indonesia</span>
                    </div>
                </div>
                <div class="card-content">
                    <h2 class="card-title">Pura Lempuyang Bali</h2>
                    <div class="card-rating">
                        <span>
                            Tingkat populer ; <strong> 4.8</strong>
                        </span>
                        <i data-feather="star" class="star"></i>
                    </div>
                    <p class="card-description">
                        Nikmati surga tersembunyi dengan arsitektur seni di Pura Lempuyang Bali,
                        Indonesia
                    </p>
                </div>
                <div class="card-footer">
                    <div class="card-price">
                        <span class="price">Rp. 1.500.000</span>
                        <span class="price-desc">/ car (max 6 person)</span>
                    </div>
                    <button class="btn-booking">Booking Now</button>
                </div>
            </div>
        </div>
    </main>





    <!-- ===script feather icons=== -->
    <script>
        feather.replace();
    </script>
</body>

</html>
