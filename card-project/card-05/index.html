<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Card Part #05</title>
    <!-- === STYLE.CSS === -->
    <link rel="stylesheet" href="style.css">

    <!-- === GOOGLE FONTS === -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">

    <!-- === FEATHER ICONS === -->
    <script src="https://unpkg.com/feather-icons"></script>
</head>

<body>
    <main class="main-container">
        <header class="page-header">
            <h1>
                Daftar Card Sepatu
            </h1>
        </header>
        <div class="card-grid">
            <section class="card">
                <div class="img">
                    <img src="img/01.jpg" alt="Sepatu Nike">
                    <span class="card-bedge">Diskon 20%</span>
                </div>
                <div class="card-content">
                    <div class="content">
                        <span class="card-categori">Sepatu Olahraga</span>
                        <h2 class="card-title">
                            Nike Air Max Speed v4
                        </h2>
                        <p class="card-descripsi">
                            Desain ergonomis dengan teknologi bantalan udara mutakhir untuk kenyamanan maksimal saat
                            berlari
                            maupun bergaya sehari-hari.
                        </p>
                    </div>
                    <div class="card-price">
                        <span class="price-current">Rp 1.500.000</span>
                        <span class="price-old">Rp 2.200.000</span>
                    </div>
                    <button class="btn">Masukan Keranjang</button>
                </div>
            </section>
        </div>
    </main>




    <!-- === SCRIPT FOR FEATHER ICONS === -->
    <script>
        feather.replace();
    </script>
</body>

</html>
