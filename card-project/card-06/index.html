<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Card-Simple Part #06</title>
    <!-- === STYLE.CSS === -->
    <link rel="stylesheet" href="style.css">

    <!-- === GOOGLE FONTS === -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">

    <!-- === FEATHER ICONS === -->
    <script src="https://unpkg.com/feather-icons"></script>
</head>

<body>
    <main class="main-container">
        <header class="page-header">
            <h1>Card Simple HTML & CSS</h1>
        </header>
        <div class="grid">
            <section class="card">
                <div class="img">
                    <img src="img/01.jpg" alt="persawahan">
                    <div class="icons">
                        <span>
                            <i data-feather="map-pin"></i>
                            Tabanan
                        </span>
                        <span>
                            <i data-feather="map-pin"></i>
                            Bali
                        </span>
                    </div>
                </div>
                <div class="title">
                    <h2>Tabanan Bali</h2>
                    <p class="descripsi">
                        Nikmati Jelajahi keindahan alam di Tabanan BALI, dan persawahan yang indah.
                    </p>
                </div>
                <div class="booking-now">
                    <button>booking now</button>
                </div>
            </section>
        </div>
    </main>


    <!-- === SCRIPT FOR FEATHER ICONS === -->
    <script>
        feather.replace();
    </script>
</body>

</html>
