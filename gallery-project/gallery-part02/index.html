<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Project Part #02</title>
    <!-- style css -->
    <link rel="stylesheet" href="app.css">
</head>

<body>
    <input type="radio" name="photo" id="check1" checked>
    <input type="radio" name="photo" id="check2">
    <input type="radio" name="photo" id="check3">
    <input type="radio" name="photo" id="check4">

    <main class="main-container">
        <header class="page-header">
            <h1>our photo gallery</h1>
        </header>
        <article class="top-content">
            <h3>photo gallery</h3>
            <label for="check1">all photo</label>
            <label for="check2">family photo</label>
            <label for="check3">child photo</label>
            <label for="check4">visited place</label>
        </article>
        <section class="photo-gallery">
            <div class="pic place">
                <img src="img/01.jpg" alt="">
            </div>
            <div class="pic family">
                <img src="img/02.jpg" alt="">
            </div>
            <div class="pic child">
                <img src="img/03.jpg" alt="">
            </div>
            <div class="pic place">
                <img src="img/04.jpg" alt="">
            </div>
            <div class="pic family">
                <img src="img/05.jpg" alt="">
            </div>
            <div class="pic child">
                <img src="img/06.jpg" alt="">
            </div>
            <div class="pic place">
                <img src="img/07.jpg" alt="">
            </div>
            <div class="pic family">
                <img src="img/08.jpg" alt="">
            </div>
            <div class="pic child">
                <img src="img/01.jpg" alt="">
            </div>
            <div class="pic place">
                <img src="img/10.jpg" alt="">
            </div>
            <div class="pic family">
                <img src="img/08.jpg" alt="">
            </div>
            <div class="pic family">
                <img src="img/07.jpg" alt="">
            </div>
        </section>
    </main>
</body>

</html>
