<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Form Login Part-#04</title>
    <!-- === MY STYLE CSS === -->
    <link rel="stylesheet" href="style.css">

    <!-- === GOOGLE FONTS === -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">

    <!-- === FEATHER ICONS === -->
    <script src="https://unpkg.com/feather-icons"></script>
</head>

<body>
    <main class="main-container">
        <div class="card-form">
            <header class="page-header">
                <h1>
                    form-login
                </h1>
            </header>
            <form action="" class="form">
                <!-- === group email === -->
                <div class="input-group">
                    <label for="mail">Email</label>
                    <div class="input-wrapper">
                        <input type="email" name="email" id="mail" class="input" placeholder="name@email.com" required>
                    </div>
                </div>

                <!-- === group password === -->
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" name="passowrd" id="password" class="input" placeholder="....." required>
                        <button type="button" class="toggle-password" id="togglePassword"
                            aria-label="toggle password visibility">
                            <i data-feather="eye" class="icon-input" id="eyeIcons"></i>
                        </button>
                    </div>
                </div>
                <!-- === remember me & forget password === -->
                <div class="form-option">
                    <div class="checkbox">
                        <input type="checkbox" name="remember" id="checkbox" required>
                        <label for="checkbox">Remember me</label>
                    </div>
                    <div class="forget">
                        <a href="#" class="forget-password">Forget password</a>
                    </div>
                </div>

                <!-- === button submit === -->
                <div class="btn-submit">
                    <button type="submit">login</button>
                </div>

                <!-- === social login === -->
                <div class="social-login">
                    <span class="login-with">or login with</span>
                    <a href="#" class="btn-google">
                        <img src="" alt="logo google">
                        <span>Google</span>
                    </a>
                </div>
            </form>
        </div>
    </main>


    <!-- === SCRIPT FOR FEATHER ICONS === -->
    <script>
        feather.replace();
    </script>
</body>

</html>
