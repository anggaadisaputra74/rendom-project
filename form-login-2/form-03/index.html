<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Form Login Part #03</title>
    <!-- === STYLE CSS === -->
    <link rel="stylesheet" href="style.css">

    <!-- === FEATHER ICONS === -->
    <script src="https://unpkg.com/feather-icons"></script>

    <!-- === GOOGLE FONTS === -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&display=swap"
        rel="stylesheet">
</head>

<body>
    <section class="container">
        <header class="page-header">
            <h1>Form Login</h1>
        </header>
        <form method="post">
            <div class="username">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="Your name...">
                <span><i data-feather="mail"></i></span>
            </div>
            <div class="password">
                <label for="password">Password</label>
                <input type="password" name="password" id="password">
                <span><i data-feather="eye"></i></span>
            </div>
            <div class="checkbox">
                <label for="checkbox">
                    <input type="checkbox" name="remember" id="checkbox">
                    Remember me
                </label>
            </div>
            <div class="btn">
                <button type="submit">LOGIN</button>
                <div class="icon">
                    <p class="google">
                        Login with account
                        <a href="#">
                            <img src="img/google.png" alt="logo-google">
                        </a>
                    </p>
                    <p class="forget">
                        Forget password
                    </p>
                </div>
            </div>
        </form>
    </section>



    <!-- === SCRIPT FOR FEATHER ICONS === -->
    <script>
        feather.replace();
    </script>
</body>

</html>
