<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Form Login</title>

    <!-- === STYLE CSS === -->
    <link rel="stylesheet" href="style.css">

    <!-- === FEATHER ICONS === -->
    <script src="https://unpkg.com/feather-icons"></script>

    <!-- === GOOGLE FONTS === -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="container">
        <form action="" method="post" class="login-card">
            <header class="page-header">
                <h1>Form Login</h1>
            </header>

            <!-- Group Email -->
            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <input class="input" type="email" name="email" id="email" placeholder="name@example.com" required>
                    <span class="input-icon"><i data-feather="mail"></i></span>
                </div>
            </div>

            <!-- Group Password -->
            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input class="input" type="password" name="password" id="password" placeholder="Masukkan password"
                        required>
                    <button type="button" class="toggle-password" id="togglePassword"
                        aria-label="Toggle password visibility">
                        <i data-feather="eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="form-options">
                <div class="checkbox-wrapper">
                    <input type="checkbox" name="remember" id="checkbox">
                    <label for="checkbox">Remember me</label>
                </div>
                <a href="#" class="forget-password">Forgot password?</a>
            </div>

            <!-- Submit Button -->
            <div class="btn-submit">
                <button type="submit">LOGIN</button>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <span>Or login with</span>
                <a href="#" class="btn-google">
                    <img src="img/google.png" alt="Google Logo">
                    <span>Google</span>
                </a>
            </div>
        </form>
    </main>

    <!-- === SCRIPT FEATHER ICONS & TOGGLE PASSWORD === -->
    <script>
        feather.replace();
    </script>

    <!-- === SCRIPT FOR APP.JS === -->
    <script src="app.js"></script>
</body>

</html>
